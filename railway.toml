# Railway deployment configuration for AdCopilot (API service)
#
# This file configures the primary web/API service.
# Worker and Beat services are configured via the Railway dashboard
# using the same repository — see RAILWAY_DEPLOYMENT.md for full instructions.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT automatically (default 8080).
# --proxy-headers is required so FastAPI sees the real client IPs behind Railway's proxy.
startCommand = "uvicorn adcopilot.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips '*'"

# Run Alembic migrations before each new deployment goes live.
# If the migration fails the deploy is aborted and the previous version keeps serving traffic.
preDeployCommand = "alembic -c /app/alembic.ini upgrade head"

healthcheckPath = "/health"
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
