# Railway deployment configuration for AdCopilot (API service)
#
# This file configures the primary web/API service.
# Worker and Beat services are configured via the Railway dashboard
# using the same repository — see RAILWAY_DEPLOYMENT.md for full instructions.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# NOTE: startCommand, preDeployCommand, and healthcheck are intentionally
# NOT set here — railway.toml is shared across all services (api, worker, beat)
# that deploy from this repo.  Per-service commands are configured in the
# Railway dashboard so each service runs the correct process:
#
#   api    → pre-deploy: alembic -c /app/alembic.ini upgrade head
#             start:      sh -c 'uvicorn adcopilot.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2 --proxy-headers'
#             healthcheck: /health
#
#   worker → start: celery -A adcopilot.interfaces.worker.celery_app:celery_app worker --loglevel=warning -Q default --concurrency=4 --max-tasks-per-child=200
#
#   beat   → start: celery -A adcopilot.interfaces.worker.celery_app:celery_app beat --loglevel=warning --schedule /tmp/celerybeat-schedule
