services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adcopilot
      POSTGRES_PASSWORD: adcopilot
      POSTGRES_DB: adcopilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcopilot -d adcopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "adcopilot.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./adcopilot:/app/adcopilot

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "adcopilot.interfaces.worker.celery_app:celery_app", "worker", "--loglevel=info", "-Q", "default"]

  beat:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "adcopilot.interfaces.worker.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

volumes:
  postgres_data:
