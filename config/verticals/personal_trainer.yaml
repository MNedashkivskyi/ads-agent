vertical_id: personal_trainer
display_name: Trener personalny / Dietetyk
display_emoji: "💪"
language: pl
competitive_level: medium

ad_groups:
  - name_template: "Trener personalny {city}"
    keyword_bank:
      - text: "trener personalny {city}"
        match_type: PHRASE
        priority: core
      - text: "trening personalny {city}"
        match_type: PHRASE
        priority: core
      - text: "trener online"
        match_type: PHRASE
        priority: core
      - text: "trening 1 na 1 {city}"
        match_type: EXACT
        priority: core
      - text: "plan treningowy {city}"
        match_type: PHRASE
        priority: extended
    default_bid_modifier: 1.05

  - name_template: "Dietetyk {city}"
    keyword_bank:
      - text: "dietetyk {city}"
        match_type: PHRASE
        priority: core
      - text: "dietetyk online"
        match_type: PHRASE
        priority: core
      - text: "konsultacja dietetyczna {city}"
        match_type: PHRASE
        priority: core
      - text: "dieta odchudzająca {city}"
        match_type: PHRASE
        priority: core
      - text: "dieta sportowa"
        match_type: PHRASE
        priority: extended
    default_bid_modifier: 1.1

  - name_template: "Pakiety trening + dieta {city}"
    keyword_bank:
      - text: "trening i dieta {city}"
        match_type: PHRASE
        priority: core
      - text: "plan treningowy i dietetyczny"
        match_type: PHRASE
        priority: core
      - text: "metamorfoza sylwetki {city}"
        match_type: PHRASE
        priority: core
      - text: "redukcja tkanki tłuszczowej {city}"
        match_type: PHRASE
        priority: extended
      - text: "masa mięśniowa plan"
        match_type: PHRASE
        priority: extended
    default_bid_modifier: 1.0

negatives:
  universal:
    - darmowy
    - za darmo
    - praca
    - youtube
    - tiktok
    - pdf
  vertical_specific:
    - kalkulator kalorii
    - kurs trenera
    - kurs dietetyka
    - praca dietetyk
    - przepis odchudzajacy
    - dieta jadłospis pdf

bidding_defaults:
  micro:
    bidding_strategy: MAXIMIZE_CLICKS
    max_cpc_limit_pln: 2.5
    daily_budget_ratio: 0.9
  mid:
    bidding_strategy: MAXIMIZE_CONVERSIONS
    max_cpc_limit_pln: 6.0
    daily_budget_ratio: 0.9
  growth:
    bidding_strategy: TARGET_CPA
    max_cpc_limit_pln: 12.0
    daily_budget_ratio: 0.9

extensions:
  sitelinks:
    - text: "Cennik usług"
      description1: "Pakiety treningowe"
      path: "cennik"
    - text: "Konsultacja"
      description1: "Umów się online"
      path: "konsultacja"
    - text: "Metamorfozy"
      description1: "Zobacz efekty klientów"
      path: "efekty"
    - text: "Kontakt"
      description1: "Zadzwoń lub napisz"
      path: "kontakt"
  callouts:
    - "Spersonalizowany plan"
    - "Wsparcie online"
    - "Doświadczony trener"
    - "Pierwsze spotkanie gratis"
  structured_snippet_category: "Usługi"

common_services:
  - Trening personalny stacjonarny
  - Trening personalny online
  - Plan treningowy
  - Plan dietetyczny
  - Konsultacja dietetyczna
  - Analiza składu ciała
  - Pakiet trening + dieta
  - Mentoring sportowy
