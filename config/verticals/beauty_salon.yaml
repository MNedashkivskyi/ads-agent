negatives:
  universal:
    - darmowy
    - za darmo
    - praca
    - kurs
    - szkolenie
    - jak zrobić
    - youtube
    - tiktok
    - instrukcja
  vertical_specific:
    - szkolenie fryzjerskie
    - kurs kosmetyczny
    - produkty do paznokci
    - sklep z kosmetykami
    - allegro
    - olx
    - praca kosmetyczka
    - kurs stylizacji

bidding_defaults:
  micro:
    bidding_strategy: MAXIMIZE_CLICKS
    max_cpc_limit_pln: 2.5
    daily_budget_ratio: 0.9
  mid:
    bidding_strategy: MAXIMIZE_CONVERSIONS
    max_cpc_limit_pln: 6.0
    daily_budget_ratio: 0.9
  growth:
    bidding_strategy: TARGET_CPA
    max_cpc_limit_pln: 12.0
    daily_budget_ratio: 0.9

extensions:
  sitelinks:
    - text: "Cennik usług"
      description1: "Sprawdź nasze ceny"
      path: "cennik"
    - text: "Rezerwacja online"
      description1: "Umów się przez internet"
      path: "rezerwacja"
    - text: "O nas"
      description1: "Poznaj nasz zespół"
      path: "o-nas"
    - text: "Kontakt"
      description1: "Zadzwoń lub napisz"
      path: "kontakt"
  callouts:
    - "Doświadczony personel"
    - "Rezerwacja online"
    - "Markowe produkty"
    - "Przyjazna atmosfera"
  structured_snippet_category: "Usługi"

common_services:
  - Manicure hybrydowy
