vertical_id: cleaning_service
display_name: Firma sprzątająca
display_emoji: "🧹"
language: pl
competitive_level: low

ad_groups:
  - name_template: "Sprzątanie domów i mieszkań {city}"
    keyword_bank:
      - text: "sprzątanie mieszkania {city}"
        match_type: PHRASE
        priority: core
      - text: "firma sprzątająca {city}"
        match_type: PHRASE
        priority: core
      - text: "sprzątanie domu {city}"
        match_type: EXACT
        priority: core
      - text: "usługi sprzątania {city}"
        match_type: PHRASE
        priority: core
      - text: "sprzątaczka {city}"
        match_type: PHRASE
        priority: core
      - text: "pomoc domowa {city}"
        match_type: PHRASE
        priority: core
      - text: "pranie dywanów {city}"
        match_type: PHRASE
        priority: core
      - text: "mycie okien {city}"
        match_type: PHRASE
        priority: core
      - text: "regularne sprzątanie mieszkania {city}"
        match_type: PHRASE
        priority: extended
      - text: "sprzątanie po przeprowadzce {city}"
        match_type: PHRASE
        priority: extended
    default_bid_modifier: 1.0

  - name_template: "Sprzątanie biur {city}"
    keyword_bank:
