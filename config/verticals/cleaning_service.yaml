        match_type: PHRASE
        priority: core
      - text: "sprzątanie pomieszczeń biurowych {city}"
        match_type: EXACT
        priority: core
      - text: "cleaning firma {city}"
        match_type: PHRASE
        priority: core
      - text: "sprzątanie hal i magazynów {city}"
        match_type: PHRASE
        priority: core
      - text: "serwis utrzymania czystości {city}"
        match_type: PHRASE
        priority: core
      - text: "dezynfekcja pomieszczeń {city}"
        match_type: PHRASE
        priority: core
      - text: "odkażanie biura {city}"
        match_type: PHRASE
        priority: core
      - text: "sprzątanie galerii handlowej {city}"
        match_type: PHRASE
        priority: extended
      - text: "serwis sprzątający hotel {city}"
        match_type: PHRASE
        priority: extended
    default_bid_modifier: 1.05

  - name_template: "Sprzątanie poremontowe {city}"
    keyword_bank:
      - text: "sprzątanie poremontowe {city}"
        match_type: PHRASE
        priority: core
      - text: "sprzątanie po remoncie {city}"
        match_type: EXACT
        priority: core
      - text: "generalne sprzątanie {city}"
