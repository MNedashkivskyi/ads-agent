        priority: core
      - text: "mycie po budowie {city}"
        match_type: PHRASE
        priority: core
      - text: "usuwanie brudu budowlanego {city}"
        match_type: PHRASE
        priority: core
      - text: "czyszczenie glazury {city}"
        match_type: PHRASE
        priority: core
      - text: "mycie elewacji {city}"
        match_type: PHRASE
        priority: core
      - text: "pranie tapicerki {city}"
        match_type: PHRASE
        priority: core
      - text: "czyszczenie kanapy {city}"
        match_type: PHRASE
        priority: extended
      - text: "pranie materaców {city}"
        match_type: PHRASE
        priority: extended
    default_bid_modifier: 1.0

negatives:
  universal:
    - darmowy
    - za darmo
    - praca
    - kurs
    - szkolenie
    - jak zrobić
    - youtube
    - tiktok
  vertical_specific:
    - praca sprzątaczka
    - praca sprzątanie
    - środki czystości
    - sklep z chemią
    - odkurzacz kupię
    - mop kupię

bidding_defaults:
  micro:
    bidding_strategy: MAXIMIZE_CLICKS
    max_cpc_limit_pln: 1.5
    daily_budget_ratio: 0.9
  mid:
    bidding_strategy: MAXIMIZE_CONVERSIONS
    max_cpc_limit_pln: 4.0
    daily_budget_ratio: 0.9
  growth:
    bidding_strategy: TARGET_CPA
    max_cpc_limit_pln: 8.0
    daily_budget_ratio: 0.9

extensions:
  sitelinks:
    - text: "Cennik"
      description1: "Sprawdź nasze ceny"
      path: "cennik"
    - text: "Zamów sprzątanie"
      description1: "Łatwa rezerwacja online"
      path: "zamow"
    - text: "Sprzątanie biur"
      description1: "Profesjonalny serwis B2B"
      path: "biura"
    - text: "Kontakt"
      description1: "Zadzwoń lub napisz"
      path: "kontakt"
  callouts:
    - "Profesjonalny sprzęt"
    - "Ekologiczne środki"
    - "Terminowość"
    - "Ubezpieczeni pracownicy"
  structured_snippet_category: "Usługi"

common_services:
  - Sprzątanie mieszkań
  - Sprzątanie domów
  - Sprzątanie biur
  - Sprzątanie poremontowe
  - Generalne sprzątanie
  - Mycie okien
  - Pranie dywanów
  - Pranie tapicerki
  - Dezynfekcja pomieszczeń
  - Mycie elewacji
