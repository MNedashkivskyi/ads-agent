[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adcopilot"
version = "0.1.0"
description = "Google Ads Co-Pilot — AI-powered ad management assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "google-ads>=24.0.0",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "anthropic>=0.93.0",
    "tenacity>=9.1.4",
    "bcrypt>=5.0.0",
    "stripe>=15.0.1",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi,celery,sqlalchemy]>=2.18.0",
    "boto3>=1.34.0",
    # Security patches for transitive dependencies
    "idna>=3.15",
    "mako>=1.3.12",
    "starlette>=1.0.1",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
    "respx>=0.21.0",
    "anyio>=4.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adcopilot"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
